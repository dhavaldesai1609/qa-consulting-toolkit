# GitHub Actions – Quality Gates
# Copy this file into .github/workflows/quality-gates.yml in the target repository.

name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests (Fast Feedback)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://example.com' }}
          CI: true

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

  regression:
    name: Regression Suite
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full regression
        run: npm test
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://example.com' }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.com' }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: playwright-report/
          retention-days: 14

  quality-gate:
    name: Quality Gate Decision
    runs-on: ubuntu-latest
    needs: [smoke, regression]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Smoke result: ${{ needs.smoke.result }}"
          echo "Regression result: ${{ needs.regression.result }}"
          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "Smoke tests failed – blocking"
            exit 1
          fi
          echo "Quality gate passed"
